<main class="edit-page"><a routerLink="/profile" class="back">← Mon profil</a><header><span class="eyebrow">ESPACE PERSONNEL</span><h1>Modifier mon profil</h1><p>Votre profil aide à calculer vos compatibilités.</p></header><p class="state" *ngIf="loading">Chargement…</p><form *ngIf="!loading" (ngSubmit)="save()"><section><h2>Informations personnelles</h2><div class="fields"><label>Prénom<input name="firstName" [(ngModel)]="form.firstName" required></label><label>Nom<input name="lastName" [(ngModel)]="form.lastName" required></label><label>Téléphone<input name="phone" [(ngModel)]="form.phone" placeholder="+216 …"></label><label>Date de naissance<input name="birthDate" type="date" [(ngModel)]="form.birthDate"></label><label>Genre<select name="gender" [(ngModel)]="form.gender"><option [ngValue]="null">Non renseigné</option><option value="FEMALE">Femme</option><option value="MALE">Homme</option><option value="OTHER">Autre</option></select></label><label>Photo (URL)<input name="photoUrl" [(ngModel)]="form.photoUrl" placeholder="https://…"></label><label class="wide">Études ou activité<input name="institution" [(ngModel)]="form.institutionOrWorkplace"></label><label class="wide">Présentation<textarea name="bio" maxlength="500" rows="3" [(ngModel)]="form.bio"></textarea></label></div></section><section><h2>Ma recherche de logement</h2><div class="fields"><label>Ville souhaitée<input name="city" [(ngModel)]="form.preferredCity"></label><label>Budget minimum (TND)<input name="budgetMin" type="number" min="0" [(ngModel)]="form.budgetMin"></label><label>Budget maximum (TND)<input name="budgetMax" type="number" min="0" [(ngModel)]="form.budgetMax"></label></div></section><section><h2>Mon mode de vie</h2><div class="fields"><label>Rythme de sommeil<select name="sleep" [(ngModel)]="form.sleepSchedule"><option [ngValue]="null">Non renseigné</option><option value="EARLY_BIRD">Lève-tôt</option><option value="NIGHT_OWL">Couche-tard</option><option value="FLEXIBLE">Flexible</option></select></label><label>Propreté <span>{{ form.cleanlinessLevel ?? '—' }} / 5</span><input name="cleanliness" type="range" min="1" max="5" [(ngModel)]="form.cleanlinessLevel"></label><label class="check"><input name="smoker" type="checkbox" [(ngModel)]="form.smoker"> Je fume</label><label class="check"><input name="pets" type="checkbox" [(ngModel)]="form.hasPets"> J’ai des animaux</label><label class="check"><input name="guests" type="checkbox" [(ngModel)]="form.guestsAllowed"> J’accepte les invités</label></div></section><p class="message error" *ngIf="error">{{ error }}</p><p class="message success" *ngIf="success">{{ success }}</p><footer><a routerLink="/profile" class="cancel">Annuler</a><button [disabled]="saving">{{ saving ? 'Enregistrement…' : 'Enregistrer mon profil' }}</button></footer></form></main>
