<div class="login-shell">
  <header class="login-header">
    <a class="back-link" routerLink="/">‹ <span>Accueil</span></a>
    <a class="brand" routerLink="/">fast<span>Colloc</span>.tn</a>
    <span class="header-note">Espace membre</span>
  </header>

  <main class="login-card">
    <div class="welcome-icon" aria-hidden="true">👋</div>
    <h1>Ravi de vous revoir !</h1>
    <p class="subtitle">Connectez-vous à votre compte FastColloc</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <label class="field">
        <span>ADRESSE EMAIL</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.com">
        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">L'adresse email est obligatoire.</small>
        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">Saisissez une adresse email valide.</small>
      </label>

      <label class="field">
        <span>MOT DE PASSE</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="Votre mot de passe">
        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">Le mot de passe est obligatoire.</small>
      </label>

      <div class="forgot-link"><a routerLink="/forgot-password">Mot de passe oublié ?</a></div>
      <p class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      <button class="submit-button" type="submit" [disabled]="loading">{{ loading ? 'Connexion…' : 'Se connecter →' }}</button>
    </form>

    <p class="signup-prompt">Vous n'avez pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
  </main>

  <footer class="privacy-note">Vos données sont protégées · <a routerLink="/">Politique de confidentialité</a></footer>
</div>
